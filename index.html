<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#f8f6ff"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Fluu</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════
   PALETAS DE COLOR
═══════════════════════════════════════ */
:root {
  --accent:       #7c5cbf;
  --accent-light: #a07de0;
  --accent-soft:  #ede8fb;
  --accent2:      #f4845f;
  --accent3:      #5b9cf6;
  --green:        #3ecf8e;
  --yellow:       #f9c74f;
  --red:          #f26b6b;

  /* Light mode */
  --bg:        #f4f2fb;
  --surface:   #ffffff;
  --surface2:  #f9f8ff;
  --border:    #ede8fb;
  --text:      #1e1740;
  --text2:     #4a4070;
  --muted:     #9890b8;
  --shadow:    0 2px 16px rgba(124,92,191,0.10);
  --shadow-md: 0 4px 24px rgba(124,92,191,0.14);
  --top-h:     60px;
  --sidebar-w: 220px;
}

/* Paletas alternativas */
:root[data-palette="blue"] {
  --accent:       #3b82f6;
  --accent-light: #60a5fa;
  --accent-soft:  #eff6ff;
  --accent2:      #f59e0b;
  --accent3:      #10b981;
}
:root[data-palette="green"] {
  --accent:       #10b981;
  --accent-light: #34d399;
  --accent-soft:  #ecfdf5;
  --accent2:      #f59e0b;
  --accent3:      #6366f1;
}
:root[data-palette="pink"] {
  --accent:       #ec4899;
  --accent-light: #f472b6;
  --accent-soft:  #fdf2f8;
  --accent2:      #8b5cf6;
  --accent3:      #06b6d4;
}
:root[data-palette="orange"] {
  --accent:       #f97316;
  --accent-light: #fb923c;
  --accent-soft:  #fff7ed;
  --accent2:      #eab308;
  --accent3:      #6366f1;
}

/* Dark mode */
body.dark {
  --bg:        #13111e;
  --surface:   #1e1b2e;
  --surface2:  #252238;
  --border:    #2e2a45;
  --text:      #f0ecff;
  --text2:     #c4b8e8;
  --muted:     #7a6fa0;
  --shadow:    0 2px 16px rgba(0,0,0,0.30);
  --shadow-md: 0 4px 24px rgba(0,0,0,0.40);
}

/* ═══════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Nunito', 'Manrope', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
}
input, select, button, textarea {
  font-family: inherit;
}
a { color: var(--accent); text-decoration: none; }

/* ═══════════════════════════════════════
   LOADING OVERLAY
═══════════════════════════════════════ */
#loading-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px;
}
.loading-logo {
  font-size: 2.4rem; font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.loading-spinner {
  width: 44px; height: 44px;
  border: 4px solid var(--accent-soft);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 0.9rem; color: var(--muted); font-weight: 600; }

/* ═══════════════════════════════════════
   SAVE INDICATOR
═══════════════════════════════════════ */
#save-indicator {
  position: fixed; bottom: 20px; right: 20px; z-index: 8888;
  background: var(--accent); color: #fff;
  border-radius: 100px; padding: 8px 18px;
  font-size: 0.8rem; font-weight: 700;
  display: none; align-items: center; gap: 8px;
  box-shadow: var(--shadow-md);
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ═══════════════════════════════════════
   LOGIN SCREEN
═══════════════════════════════════════ */
#loginWrap {
  position: fixed; inset: 0; z-index: 9000;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.login-container {
  display: flex; align-items: center; justify-content: center;
  gap: 0; max-width: 900px; width: 100%;
}
.login-avatar-side {
  display: none;
  flex-direction: column; align-items: center; justify-content: center;
  padding: 40px;
  flex: 1;
}
@media (min-width: 700px) {
  .login-avatar-side { display: flex; }
}
.login-avatar-side svg { width: 280px; height: 280px; filter: drop-shadow(0 8px 24px rgba(124,92,191,0.20)); }
.login-avatar-greeting {
  margin-top: 16px; font-size: 1.3rem; font-weight: 800;
  color: var(--accent); text-align: center;
}
.login-avatar-sub {
  font-size: 0.9rem; color: var(--muted); margin-top: 4px; text-align: center;
}
.login-card {
  background: var(--surface);
  border-radius: 28px;
  padding: 44px 40px;
  box-shadow: var(--shadow-md);
  width: 100%; max-width: 400px;
  border: 1px solid var(--border);
}
.login-logo {
  display: flex; align-items: center; gap: 10px; margin-bottom: 28px;
}
.login-logo-icon {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; box-shadow: 0 4px 12px rgba(124,92,191,0.30);
}
.login-logo-text {
  font-size: 1.8rem; font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.login-title { font-size: 1.4rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.login-sub { font-size: 0.88rem; color: var(--muted); margin-bottom: 28px; }
.login-field {
  position: relative; margin-bottom: 14px;
}
.login-field-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 1rem; pointer-events: none;
}
.login-input {
  width: 100%; padding: 14px 14px 14px 42px;
  border: 2px solid var(--border);
  border-radius: 14px; font-size: 0.95rem; font-weight: 600;
  background: var(--surface2); color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}
.login-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.login-forgot {
  text-align: right; margin-bottom: 20px;
  font-size: 0.82rem; font-weight: 700; color: var(--accent);
  cursor: pointer;
}
.login-forgot:hover { text-decoration: underline; }
.login-btn {
  width: 100%; padding: 15px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: #fff; border: none; border-radius: 14px;
  font-size: 1rem; font-weight: 800; cursor: pointer;
  box-shadow: 0 4px 16px rgba(124,92,191,0.35);
  transition: transform 0.15s, box-shadow 0.15s;
}
.login-btn:active { transform: scale(0.98); }
.login-btn:hover { box-shadow: 0 6px 20px rgba(124,92,191,0.45); }
.login-error {
  background: #fef2f2; border: 1px solid #fecaca;
  color: #dc2626; border-radius: 10px; padding: 10px 14px;
  font-size: 0.82rem; font-weight: 600; margin-top: 12px;
  display: none;
}
.login-error.show { display: block; }
.login-version {
  text-align: center; font-size: 0.75rem; color: var(--muted);
  margin-top: 20px; font-weight: 600;
}

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
#toast-container {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  z-index: 9500; display: flex; flex-direction: column; gap: 8px; align-items: center;
}
.toast-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 10px 20px;
  font-size: 0.85rem; font-weight: 700; color: var(--text);
  box-shadow: var(--shadow-md);
  display: flex; align-items: center; gap: 8px;
  animation: toastIn 0.3s ease;
  white-space: nowrap;
}
.toast-item.error { border-color: var(--red); color: var(--red); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ═══════════════════════════════════════
   TOPBAR
═══════════════════════════════════════ */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--top-h);
  background: var(--surface); z-index: 100;
  display: flex; align-items: center; padding: 0 16px 0 0;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 8px rgba(124,92,191,0.06);
}
#topbar-logo {
  width: var(--sidebar-w); flex-shrink: 0;
  display: flex; align-items: center; gap: 10px; padding: 0 20px;
}
@media (max-width: 768px) { #topbar-logo { width: auto; } }
.topbar-logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; box-shadow: 0 2px 8px rgba(124,92,191,0.25);
}
.topbar-logo-text {
  font-size: 1.4rem; font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
#menu-toggle {
  display: none; background: none; border: none;
  cursor: pointer; font-size: 1.3rem; color: var(--text);
  padding: 8px; border-radius: 10px; margin-right: 8px;
}
@media (max-width: 768px) { #menu-toggle { display: block; } }
#topbar-center { flex: 1; }
#dateDisplay { font-size: 0.82rem; font-weight: 700; color: var(--muted); }
#topbar-right { display: flex; align-items: center; gap: 8px; }
.topbar-btn {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1rem; color: var(--text2);
  transition: background 0.15s;
}
.topbar-btn:hover { background: var(--accent-soft); color: var(--accent); }
#topbar-user {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 4px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 100px; cursor: pointer;
}
#topbar-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; color: #fff; font-weight: 800;
}
#topbar-username { font-size: 0.8rem; font-weight: 700; color: var(--text2); }

/* ═══════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════ */
#sidebar {
  position: fixed; top: var(--top-h); left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  z-index: 99; overflow-y: auto;
  transition: transform 0.3s ease;
}
@media (max-width: 768px) {
  #sidebar { transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); box-shadow: var(--shadow-md); }
}
#sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.3); z-index: 98;
  backdrop-filter: blur(2px);
}
#sidebar-overlay.show { display: block; }

.sidebar-avatar-section {
  padding: 20px 16px 12px;
  display: flex; flex-direction: column; align-items: center;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.sidebar-avatar {
  width: 72px; height: 72px; margin-bottom: 8px;
}
.sidebar-user-name {
  font-size: 0.95rem; font-weight: 800; color: var(--text);
  text-align: center; line-height: 1.2;
}
.sidebar-user-email {
  font-size: 0.72rem; color: var(--muted); font-weight: 600;
  text-align: center; margin-top: 2px;
  max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.sidebar-section-title {
  font-size: 0.65rem; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 8px 18px 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 18px; margin: 1px 8px;
  border-radius: 12px; cursor: pointer;
  font-size: 0.88rem; font-weight: 700; color: var(--text2);
  transition: background 0.15s, color 0.15s;
}
.nav-item:hover { background: var(--accent-soft); color: var(--accent); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-icon {
  width: 32px; height: 32px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem; flex-shrink: 0;
  background: var(--surface2);
}
.nav-item.active .nav-icon { background: var(--accent); filter: brightness(1.1); }
.nav-item:hover .nav-icon { background: var(--accent-soft); }

.sidebar-bottom {
  margin-top: auto; padding: 12px 10px;
  border-top: 1px solid var(--border);
}
.sidebar-logout {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 12px;
  cursor: pointer; font-size: 0.85rem; font-weight: 700;
  color: var(--red); background: none; border: none; width: 100%;
  transition: background 0.15s;
}
.sidebar-logout:hover { background: #fef2f2; }
.sidebar-firebase-badge {
  text-align: center; font-size: 0.65rem; color: var(--muted);
  font-weight: 600; padding: 6px; margin-top: 4px;
}

/* ═══════════════════════════════════════
   MAIN CONTENT
═══════════════════════════════════════ */
#app-body {
  margin-top: var(--top-h);
  margin-left: var(--sidebar-w);
  min-height: calc(100vh - var(--top-h));
  padding: 24px;
  transition: margin-left 0.3s;
}
@media (max-width: 768px) {
  #app-body { margin-left: 0; padding: 16px; }
}

/* Page */
.page { display: none; }
.page.active { display: block; }

/* Page header */
.page-header {
  margin-bottom: 20px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
.page-title {
  font-size: 1.6rem; font-weight: 900; color: var(--text);
  display: flex; align-items: center; gap: 10px;
}
.page-title-icon {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; color: #fff;
  box-shadow: 0 3px 10px rgba(124,92,191,0.25);
}

/* Cards */
.card {
  background: var(--surface);
  border-radius: 18px;
  padding: 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}
.card-title {
  font-size: 0.8rem; font-weight: 800;
  color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.07em; margin-bottom: 14px;
  display: flex; align-items: center; gap: 6px;
}

/* Stat cards grid */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px; margin-bottom: 16px;
}
.stat-card {
  background: var(--surface);
  border-radius: 16px; padding: 16px 18px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.stat-card.full { grid-column: 1/-1; }
.stat-label {
  font-size: 0.7rem; font-weight: 800;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em;
  margin-bottom: 6px;
}
.stat-value {
  font-size: 2rem; font-weight: 900; color: var(--text);
  line-height: 1; font-variant-numeric: tabular-nums;
}
.stat-sub { font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-top: 4px; }

/* Dashboard welcome card */
.dash-welcome {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
  border-radius: 20px; padding: 20px 22px;
  margin-bottom: 16px; position: relative; overflow: hidden;
  box-shadow: 0 6px 24px rgba(124,92,191,0.25);
}
.dash-welcome::before {
  content: ''; position: absolute;
  top: -30px; right: -30px;
  width: 120px; height: 120px;
  background: rgba(255,255,255,0.10);
  border-radius: 50%;
}
.dash-welcome::after {
  content: ''; position: absolute;
  bottom: -20px; right: 60px;
  width: 80px; height: 80px;
  background: rgba(255,255,255,0.07);
  border-radius: 50%;
}
.dash-welcome-greeting {
  font-size: 1rem; font-weight: 700; color: rgba(255,255,255,0.85);
  margin-bottom: 4px;
}
.dash-welcome-name {
  font-size: 1.5rem; font-weight: 900; color: #fff;
  margin-bottom: 6px;
}
.dash-welcome-date {
  font-size: 0.78rem; font-weight: 600; color: rgba(255,255,255,0.70);
}

/* Badges */
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 9px; border-radius: 100px;
  font-size: 0.68rem; font-weight: 800;
  letter-spacing: 0.03em;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border-radius: 12px;
  font-size: 0.88rem; font-weight: 700; cursor: pointer;
  border: none; transition: all 0.15s; font-family: inherit;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: #fff; box-shadow: 0 3px 12px rgba(124,92,191,0.30);
}
.btn-primary:hover { box-shadow: 0 5px 18px rgba(124,92,191,0.40); transform: translateY(-1px); }
.btn-ghost {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
}
.btn-ghost:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.btn-danger {
  background: #fef2f2; border: 1px solid #fecaca; color: var(--red);
}
.btn-danger:hover { background: #fee2e2; }
.btn-orange {
  background: linear-gradient(135deg, var(--accent2), #f9956f);
  color: #fff; box-shadow: 0 3px 12px rgba(244,132,95,0.30);
}
.btn-full { width: 100%; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

/* Forms */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 0.78rem; font-weight: 800;
  color: var(--text2); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.form-input {
  width: 100%; padding: 12px 14px;
  border: 2px solid var(--border); border-radius: 12px;
  font-size: 0.92rem; font-weight: 600;
  background: var(--surface2); color: var(--text);
  outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  font-family: inherit; margin-bottom: 0;
}
.form-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
select.form-input { cursor: pointer; }

/* Historial items */
.hist-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 0; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background 0.1s;
  border-radius: 0;
}
.hist-item:last-child { border-bottom: none; }
.hist-item:hover { background: var(--accent-soft); margin: 0 -8px; padding: 14px 8px; border-radius: 12px; }
.hist-icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; flex-shrink: 0;
}

/* Bodega rows */
.bodega-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.bodega-row:last-child { border-bottom: none; }
.bodega-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* Ganancias */
.gan-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;
}
.gan-card {
  background: var(--surface); border-radius: 16px; padding: 18px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.gan-card.full, .gan-card[style*="grid-column"] { grid-column: 1/-1; }

/* Confirm overlay */
#confirmOverlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 8000; display: none; align-items: center; justify-content: center;
  padding: 20px; backdrop-filter: blur(4px);
}
